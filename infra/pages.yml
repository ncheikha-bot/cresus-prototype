# Publication du prototype sur GitHub Pages — publication automatique.
#
# CE FICHIER N'EST PAS ENCORE ACTIF. Il attend ici parce que le jeton
# d'authentification utilisé pour créer le dépôt n'a pas la portée « workflow »,
# que GitHub exige pour déposer un fichier d'Actions. Pour l'activer :
#
#     gh auth refresh -s workflow          # ouvre le navigateur, une seule fois
#     mkdir -p .github/workflows
#     git mv infra/pages.yml .github/workflows/pages.yml
#     git commit -m "Publication automatique sur GitHub Pages" && git push
#
# Puis, dans le dépôt : Settings → Pages → Source = « GitHub Actions ».
#
# En attendant, le site est publié depuis la branche `gh-pages`, reconstruite
# par `npm run deploy`.
#
# Déclenchée à chaque poussée sur `main`, et manuellement depuis l'onglet
# Actions. Les identifiants de la base partagée viennent des secrets du dépôt :
# sans eux, le site se publie quand même et retombe sur le stockage local.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois ; on n'interrompt pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Construire
        env:
          # Le site est servi depuis /<nom-du-depot>/.
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Repli des liens profonds
        # GitHub Pages ne connaît que des fichiers : /web/dashboard n'existe pas
        # sur le disque et renverrait une 404. Servir l'application sur la page
        # d'erreur laisse le routeur reprendre la main.
        run: cp build/index.html build/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
